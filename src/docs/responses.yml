components:
  responses:
    InvalidInput:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 400
            message: Invalid input
    
    Unauthorized:
      description: Unauthorized (Access token not found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 401
            message: Please authenticate
    
    Forbidden:
      description: Access forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 403
            message: Forbidden
    
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 404
            message: Not found
    
    UserConflict:
      description: Conflict - Email or Username already taken
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            duplicateEmail:
              summary: Email already exists
              value:
                code: 409
                message: Email already taken
            duplicateUsername:
              summary: Username already exists
              value:
                code: 409
                message: Username already taken

    TitleConflict:
      description: Title already taken
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 409
            message: Title already taken        
