components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        photo:
          type: string
      example:
        id: 5ebac534954b54139806c112
        email: fake@example.com
        name: Fake name
        photo: fake_photo.png
    Token:
      type: object
      properties:
        token:
          type: string
      example:
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string
    Campground:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        location:
          type: string
        price:
          type: number
        images:
          type: array
          items:
            type: string
        active:
          type: boolean
      example:
        id: 6757243ca3c9ec43b05e341e
        title: Fake Title
        description: Fake description for this campground
        location: Fake location
        price: 100
        images: [fake01.png, fake02.png]
    Review:
      type: object
      properties:
        id:
          type: string
        body:
          type: string
        rating:
          type: number
